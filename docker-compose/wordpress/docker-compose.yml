version: "3.8"

services:
  wordpress:
    image: wordpress:latest
    container_name: wordpress_app
    restart: always
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppassword
      WORDPRESS_DB_NAME: WordPressDB
    ports:
      - "8082:80"
    volumes:
      - wordpress_data:/var/www/html

volumes:
  wordpress_data:
