version: "3"

services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "1313:80"     # Web en puerto 1313
      - "53:53/tcp"   # DNS TCP
      - "53:53/udp"   # DNS UDP
      - "443:443/tcp"
      # "67:67/udp"
    environment:
      TZ: "America/Santiago"
      FTLCONF_webserver_api_password: 'password'
      # WEBPASSWORD: "password"
      DNS1: "1.1.1.1" # Cloudflare
      DNS2: "9.9.9.9" # Quad9
    volumes:
      - pihole_data:/etc/pihole
      - dnsmasq_data:/etc/dnsmasq.d
    restart: unless-stopped
    cap_add:
      - NET_ADMIN

volumes:
  pihole_data:
  dnsmasq_data:
